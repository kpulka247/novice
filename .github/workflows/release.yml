name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    name: Create release and build
    runs-on: ubuntu-latest
    outputs:
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

      - name: Run semantic-release
        id: semantic
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        if: steps.semantic.outputs.new_release_version != ''
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/

  publish-chrome:
    name: Publish to Chrome Web Store
    needs: release
    runs-on: ubuntu-latest
    if: needs.release.outputs.new_release_version != ''
    env:
      CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: ./dist

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Skip until the Chrome secrets are set
        if: env.CHROME_EXTENSION_ID == ''
        run: echo "::notice::CHROME_EXTENSION_ID is not set, so this release was not uploaded to the Chrome Web Store."

      - name: Publish to Chrome Web Store
        if: env.CHROME_EXTENSION_ID != ''
        run: |
          pnpm dlx chrome-webstore-upload-cli@4 \
            --source dist/novice-${{ needs.release.outputs.new_release_version }}-chrome.zip \
            --extension-id $CHROME_EXTENSION_ID
        env:
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}

  publish-firefox:
    name: Publish to Firefox Add-ons
    needs: release
    runs-on: ubuntu-latest
    if: needs.release.outputs.new_release_version != ''
    env:
      WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
      WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}

    steps:
      - name: Skip until the Firefox secrets are set
        if: env.WEB_EXT_API_KEY == ''
        run: echo "::notice::AMO_JWT_ISSUER is not set, so this release was not uploaded to Firefox Add-ons."

      - name: Checkout the released source
        if: env.WEB_EXT_API_KEY != ''
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.new_release_version }}

      - name: Pack the source code for the Firefox Add-ons review
        if: env.WEB_EXT_API_KEY != ''
        run: git archive --format=zip --output=/tmp/source-code.zip HEAD

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: ./dist

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Publish to Firefox Add-ons
        if: env.WEB_EXT_API_KEY != ''
        run: |
          pnpm dlx web-ext sign \
            --source-dir=dist/novice-firefox \
            --artifacts-dir=web-ext-artifacts \
            --upload-source-code=/tmp/source-code.zip \
            --channel=listed \
            --no-input
