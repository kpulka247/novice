name: Release dry run

on: workflow_dispatch

jobs:
  test-release:
    name: Simulate release and build
    runs-on: ubuntu-latest
    outputs:
      new_release_version: ${{ steps.semantic_dry_run.outputs.new_release_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run semantic-release in dry-run mode
        id: semantic_dry_run
        run: pnpm exec semantic-release --dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        if: steps.semantic_dry_run.outputs.new_release_version != ''
        uses: actions/upload-artifact@v4
        with:
          name: test-build-artifacts
          path: dist/

  test-publish-chrome:
    name: Simulate publishing to Chrome Web Store
    needs: test-release
    runs-on: ubuntu-latest
    if: needs.test-release.outputs.new_release_version != ''

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: test-build-artifacts
          path: ./dist

      - name: Show what would be published
        run: |
          echo "✅ Successfully downloaded artifacts."
          echo "ℹ️ Would publish file: dist/novice-${{ needs.test-release.outputs.new_release_version }}-chrome.zip"
          echo "✅ Chrome publish simulation complete."

  test-publish-firefox:
    name: Simulate publishing to Firefox Add-ons
    needs: test-release
    runs-on: ubuntu-latest
    if: needs.test-release.outputs.new_release_version != ''

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: test-build-artifacts
          path: ./dist

      - name: Show what would be published
        run: |
          echo "✅ Successfully downloaded artifacts."
          echo "ℹ️ Would sign and publish from source directory: dist/novice-firefox"
          echo "✅ Firefox publish simulation complete."
