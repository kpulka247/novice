<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GTA 6 Spoiler Blocker</title>
    <link rel="stylesheet" href="styles/popup.css" />
  </head>

  <body>
    <header>
      <div class="logo" id="logo"></div>
      <div>
        <h1 data-i18n="extName"></h1>
        <p class="tagline" data-i18n="tagline"></p>
      </div>
    </header>

    <main>
      <section class="stat">
        <span class="stat-number" id="count">0</span>
        <span class="stat-label" id="count-label"></span>
      </section>

      <section class="settings">
        <label class="row">
          <span class="row-text">
            <span class="row-title" data-i18n="protection"></span>
            <span class="row-hint" id="enabled-hint"></span>
          </span>
          <input type="checkbox" class="switch" id="enabled" />
        </label>

        <label class="row">
          <span class="row-text">
            <span class="row-title" data-i18n="strict"></span>
            <span class="row-hint" data-i18n="strictHint"></span>
          </span>
          <input type="checkbox" class="switch" id="strict" />
        </label>

        <label class="row" id="site-row">
          <span class="row-text">
            <span class="row-title" data-i18n="site"></span>
            <span class="row-hint" id="site-host"></span>
          </span>
          <input type="checkbox" class="switch" id="site" />
        </label>
      </section>
    </main>

    <footer>
      <a
        href="https://github.com/kpulka247/gta6-spoiler-blocker/issues"
        target="_blank"
        data-i18n="reportLeak"
      ></a>
      <a
        href="https://github.com/kpulka247/gta6-spoiler-blocker"
        target="_blank"
        data-i18n="sourceCode"
      ></a>
      <a
        href="https://ko-fi.com/Y8Y71ERSZF"
        target="_blank"
        data-i18n="support"
      ></a>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
