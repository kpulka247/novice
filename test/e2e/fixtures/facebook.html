<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <title>Facebook</title>
  </head>
  <body>
    <div role="feed">
      <div role="article" id="logitech">
        <div data-ad-rendering-role="story_message">
          <span id="logitech-text"
            >Logitech po prostu daje pracownikom dodatkowy, płatny urlop na
            granie. Firma wprowadza „Logi Game Day”, a CEO Hanneke Faber głośno
            walczy ze stereotypem, że gaming to s...</span
          >
          <div role="button" tabindex="0" id="logitech-more">
            Wyświetl więcej
          </div>
        </div>
        <img alt="Może być zdjęciem przedstawiającym 1 osoba" src="data:," />
      </div>
      <div role="article" id="cats">
        <div data-ad-rendering-role="story_message">
          <span>My cat learned a new trick</span>
          <div role="button" tabindex="0" id="cats-more">See more</div>
        </div>
      </div>
    </div>
    <script>
      document.getElementById("logitech-more").addEventListener("click", () => {
        document.getElementById("logitech-text").textContent +=
          "trata czasu. https://www.gry-online.pl/newsroom/granie-to-nie-strata-czasu-na-premiere-gta-6/z2322ef";
        document.getElementById("logitech-more").remove();
      });
      document.getElementById("cats-more").addEventListener("click", () => {
        document.getElementById("cats-more").textContent = "";
      });
    </script>
  </body>
</html>
