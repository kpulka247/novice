<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Music for everyone</title>
  </head>
  <body>
    <button id="play" type="button">Play</button>
    <audio id="track" loop></audio>
    <script>
      // Like many music players, this one names the track in the tab title
      // only while it plays.
      const rate = 8000;
      const wav = new DataView(new ArrayBuffer(44 + rate));
      const text = (at, value) =>
        [...value].forEach((c, i) => wav.setUint8(at + i, c.charCodeAt(0)));
      text(0, "RIFF");
      wav.setUint32(4, 36 + rate, true);
      text(8, "WAVEfmt ");
      wav.setUint32(16, 16, true);
      wav.setUint16(20, 1, true);
      wav.setUint16(22, 1, true);
      wav.setUint32(24, rate, true);
      wav.setUint32(28, rate, true);
      wav.setUint16(32, 1, true);
      wav.setUint16(34, 8, true);
      text(36, "data");
      wav.setUint32(40, rate, true);
      for (let i = 0; i < rate; i++) wav.setUint8(44 + i, 128);

      const track = document.getElementById("track");
      track.src = URL.createObjectURL(
        new Blob([wav.buffer], { type: "audio/wav" }),
      );
      track.addEventListener("play", () => {
        document.title = "Vice City • Night Drive";
      });
      track.addEventListener("pause", () => {
        document.title = "Music for everyone";
      });
      document
        .getElementById("play")
        .addEventListener("click", () => track.play());
    </script>
  </body>
</html>
